name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm install

    - name: Build Web Assets
      run: npm run build

    - name: Sync Capacitor Android
      run: npx cap sync android

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant Execute Permission to gradlew
      working-directory: android
      run: chmod +x gradlew

    - name: Build Android Debug APK
      working-directory: android
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SoundJam-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
      with:
        tag_name: v1.0.0
        name: "SoundJam v1.0.0 (Android APK)"
        body: |
          ## 🎧 SoundJam Android APK Download
          Download the attached `SoundJam-v1.0.0.apk` below and install it directly on your Android phone!
          
          ### Features
          - Universal multi-source playback (YouTube, Spotify, SoundCloud, Local audio, Web Streams)
          - Real-time collaborative jam sessions & queue voting
          - Multi-device synchronized audio playback with latency calibration slider
          - Background audio playback & screen wake lock
        files: android/app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
